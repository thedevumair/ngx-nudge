<app-doc-page heading="Button" lead="Three variants and three sizes, driven by theme tokens.">
  <nd-card>
    <h3 ndCardHeader>Preview</h3>
    <div class="row">
      <button nd-button syncId="docs-save">Save</button>
      <button nd-button syncId="docs-cancel" variant="outline" size="sm">Cancel</button>
      <button nd-button syncId="docs-disabled" variant="ghost" disabled>Disabled</button>
    </div>
  </nd-card>
  <app-code-block [code]="code" />
</app-doc-page>
